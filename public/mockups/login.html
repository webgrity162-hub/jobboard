<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | JobConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        linkedin: {
                            blue: '#0a66c2',
                            darkBlue: '#004182',
                            lightBlue: '#eef3f8',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Fira Sans", Ubuntu, Oxygen, "Oxygen Sans", Cantarell, "Droid Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Lucida Grande", Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="p-8">
        <a href="index.html" class="flex items-center gap-2 max-w-7xl mx-auto">
            <div class="bg-linkedin-blue text-white p-1 rounded">
                <i class="fa-solid fa-briefcase text-xl px-1"></i>
            </div>
            <span class="text-2xl font-bold text-linkedin-blue tracking-tight">JobConnect</span>
        </a>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md border border-gray-100">
            <h1 class="text-3xl font-semibold mb-2">Sign in</h1>
            <p class="text-gray-600 mb-8">Stay updated on your professional world</p>

            <form action="candidate-dashboard.html" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email or Phone</label>
                    <input type="email" id="email" class="w-full px-4 py-3 border border-gray-400 rounded focus:outline-none focus:ring-2 focus:ring-linkedin-blue focus:border-transparent transition" required>
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <input type="password" id="password" class="w-full px-4 py-3 border border-gray-400 rounded focus:outline-none focus:ring-2 focus:ring-linkedin-blue focus:border-transparent transition" required>
                        <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-linkedin-blue font-semibold hover:bg-blue-50 px-2 py-1 rounded">Show</button>
                    </div>
                </div>
                <a href="#" class="block text-linkedin-blue font-semibold hover:underline">Forgot password?</a>
                
                <button type="submit" class="w-full bg-linkedin-blue text-white py-3 rounded-full text-lg font-semibold hover:bg-linkedin-darkBlue transition shadow-md">
                    Sign in
                </button>
            </form>

            <div class="mt-8 flex items-center gap-4">
                <div class="flex-grow h-px bg-gray-300"></div>
                <span class="text-gray-500 text-sm">or</span>
                <div class="flex-grow h-px bg-gray-300"></div>
            </div>

            <div class="mt-8 space-y-4">
                <button class="w-full border border-gray-400 py-2.5 rounded-full flex items-center justify-center gap-3 hover:bg-gray-50 transition font-medium text-gray-700">
                    <img src="https://www.google.com/favicon.ico" class="w-5 h-5" alt="Google">
                    Continue with Google
                </button>
                <button class="w-full border border-gray-400 py-2.5 rounded-full flex items-center justify-center gap-3 hover:bg-gray-50 transition font-medium text-gray-700">
                    <i class="fa-brands fa-apple text-xl"></i>
                    Sign in with Apple
                </button>
            </div>
        </div>
    </main>

    <footer class="py-8 text-center text-sm text-gray-500">
        <p>New to JobConnect? <a href="register.html" class="text-linkedin-blue font-bold hover:underline">Join now</a></p>
        <div class="mt-4 flex justify-center gap-6">
            <a href="#" class="hover:underline">User Agreement</a>
            <a href="#" class="hover:underline">Privacy Policy</a>
            <a href="#" class="hover:underline">Community Guidelines</a>
            <a href="#" class="hover:underline">Copyright Policy</a>
        </div>
    </footer>

</body>
</html>
